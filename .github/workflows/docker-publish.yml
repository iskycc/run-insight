name: Docker Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/run-insight

jobs:
  quality:
    name: Lint, test, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: run_insight
          MARIADB_ROOT_PASSWORD: build-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root -pbuild-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:build-password@127.0.0.1:3306/run_insight
      JWT_SECRET: ci-build-placeholder-not-for-runtime
      SEED_ADMIN_PASSWORD: ci-admin-password-2026
      SEED_VIEWER_PASSWORD: ci-viewer-password-2026
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-admin-password-2026
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify offline runtime resources
        run: npm run check:offline

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to integration database
        run: npx prisma migrate deploy

      - name: Run MariaDB integration checks
        run: npm run test:integration

      - name: Seed E2E data
        run: npx prisma db seed

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --runInBand --coverage

      - name: Build production application
        run: npm run build

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E checks
        shell: bash
        run: |
          set -euo pipefail
          npm run start > "$RUNNER_TEMP/run-insight-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent "$E2E_BASE_URL/api/health/ready" > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/run-insight-next.log"
              exit 1
            fi
            sleep 2
          done

          if ! curl --fail --silent "$E2E_BASE_URL/api/health/ready" > /dev/null; then
            cat "$RUNNER_TEMP/run-insight-next.log"
            exit 1
          fi

          npm run test:e2e

  build-and-push:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
